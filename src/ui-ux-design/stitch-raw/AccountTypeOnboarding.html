ixed": "#dbe1ff", "secondary-container": "#316bf3" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "gutter-mobile": "0.75rem", "margin-mobile": "1rem", "margin": "1.5rem", "gutter": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "space-md": "1rem" }, fontFamily: { "label-md": ["Hanken Grotesk"], "body-md": ["Hanken Grotesk"], "label-lg": ["Hanken Grotesk"], "headline-xl-mobile": ["Hanken Grotesk"], "label-sm": ["Hanken Grotesk"], "headline-xl": ["Hanken Grotesk"], "headline-md": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "headline-lg": ["Hanken Grotesk"], "body-sm": ["Hanken Grotesk"] }, fontSize: { "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "label-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Brand Logo & Progress Pill Header -->
<header class="flex items-center justify-between py-space-sm mb-space-md">
<div class="flex items-center">
<img alt="Nexus Commerce Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XKEB8DgN-yXJedYabu7lN2_Y-Ic1nkO03XZHfBDy61uc_dhlfrVITdDYB7MnDBdSXoufIjetBvfHIz2Ayslu7QmtI_6tFzIXgGOfXBs0gVqo_wI3BeL4uIThZkKt4C6nNa8TK6BbROEPCKj5IWmYWRw6lPgLWkLnt1PAox0JqMcR3lkCnGHArJv9iZJ0_gVoMmqWT-u3c9bPgvYlNytuzdQ8x2vosYPTT9A5RRoGcS9hMX-cobsFek9zQ"/>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-fixed text-primary">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-label-sm">Step 1 of 3</span>
</div>
</header>
<!-- Step Track -->
<div class="w-full bg-surface-container-high h-1.5 rounded-full overflow-hidden mb-space-lg flex gap-1">
<div class="h-full bg-primary-container rounded-full flex-1 transition-all duration-300"></div>
<div class="h-full bg-surface-variant rounded-full flex-1"></div>
<div class="h-full bg-surface-variant rounded-full flex-1"></div>
</div>
<!-- Editorial Headline Section -->
<div class="mb-space-lg">
<div class="inline-flex items-center gap-1.5 mb-1.5 px-2.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant">
<span class="font-label-sm text-label-sm">Onboarding</span>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-2 tracking-tight">
      How do you plan to shop?
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
      Choose an account type to customize your experience and unlock relevant tiered pricing.
    </p>
</div>
<!-- Interactive Selection Area -->
<form class="flex flex-col gap-space-md mb-space-xl" id="accountSelectionForm" onsubmit="event.preventDefault();">
<!-- Option 1: Personal (Pre-selected) -->
<label class="group relative flex flex-col p-4 rounded-xl cursor-pointer transition-all duration-200 select-none bg-surface-container shadow-sm active:scale-[0.99]" id="card-personal">
<input checked="" class="sr-only" name="account_type" type="radio" value="personal"/>
<div class="flex items-start justify-between gap-3 mb-3">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-primary-container text-on-primary transition-colors duration-200" id="icon-box-personal">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
</div>
<div>
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-on-surface">Personal Use</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container-highest text-on-surface font-label-sm text-label-sm">Retail</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">For individual shoppers</span>
</div>
</div>
<!-- Custom Radio Indicator -->
<div class="w-6 h-6 rounded-full flex items-center justify-center mt-1 bg-primary-container text-on-primary transition-all duration-200 shadow-sm" id="indicator-personal">
<span class="material-symbols-outlined text-base">check</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-3 leading-snug">
        Discover curated items, exclusive personal member discounts, and seamless 1-click checkout.
      </p>
<!-- Benefit Micro-Pills -->
<div class="flex flex-wrap gap-1.5 pt-1">
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-surface-container-low text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          Individual pricing
        </span>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-surface-container-low text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm text-primary" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
          Free shipping perks
        </span>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-surface-container-low text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm text-primary" style="font-variation-settings: 'FILL' 1;">bolt</span>
          Fast delivery
        </span>
</div>
</label>
<!-- Option 2: Business / Wholesale -->
<label class="group relative flex flex-col p-4 rounded-xl cursor-pointer transition-all duration-200 select-none bg-surface-container-low shadow-none active:scale-[0.99]" id="card-business">
<input class="sr-only" name="account_type" type="radio" value="business"/>
<div class="flex items-start justify-between gap-3 mb-3">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl flex items-center justify-center bg-surface-variant text-on-surface-variant transition-colors duration-200" id="icon-box-business">
<span class="material-symbols-outlined text-2xl">handshake</span>
</div>
<div>
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-on-surface">For Business</span>
<span class="px-2 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-sm text-label-sm">Wholesale</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Commercial &amp; bulk buyers</span>
</div>
</div>
<!-- Custom Radio Indicator -->
<div class="w-6 h-6 rounded-full flex items-center justify-center mt-1 bg-surface-variant text-on-surface-variant transition-all duration-200" id="indicator-business">
<span class="material-symbols-outlined text-base opacity-0">check</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-3 leading-snug">
        Unlock volume tier pricing, bulk purchasing, tax exemption status, and dedicated corporate account support.
      </p>
<!-- Benefit Micro-Pills -->
<div class="flex flex-wrap gap-1.5 pt-1">
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-surface-container text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm text-secondary" style="font-variation-settings: 'FILL' 1;">price_check</span>
          Tiered volume discounts
        </span>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-surface-container text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm text-secondary" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
          Net-30 invoicing
        </span>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-surface-container text-on-surface font-label-sm text-label-sm">
<span class="material-symbols-outlined text-sm text-secondary" style="font-variation-settings: 'FILL' 1;">support_agent</span>
          Dedicated manager
        </span>
</div>
</label>
</form>
<!-- Interactive Trust Metrics / Reassurance Snapshot -->
<div class="p-4 rounded-xl bg-surface-container-low mb-space-lg flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-surface-container-highest flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<div>
<h4 class="font-label-md text-label-md text-on-surface">Safe &amp; Verified Data</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enterprise-grade 256-bit encryption</p>
</div>
</div>
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<!-- Persistent Sticky Bottom Action Wrapper -->
<div class="sticky bottom-0 bg-surface/95 backdrop-blur-md pt-3 pb-space-sm flex flex-col gap-2">
<button class="w-full h-12 bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md hover:bg-secondary-container active:scale-[0.98] transition-all" id="submitBtn" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<div class="flex items-center justify-center gap-1.5 text-center px-4">
<span class="material-symbols-outlined text-sm text-outline">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        You can change or add account types anytime in Settings.
      </p>
</div>
</div>
</div>
<script>
  (function () {
    const cardPersonal = document.getElementById('card-personal');
    const cardBusiness = document.getElementById('card-business');
    const iconPersonal = document.getElementById('icon-box-personal');
    const iconBusiness = document.getElementById('icon-box-business');
    const indPersonal = document.getElementById('indicator-personal');
    const indBusiness = document.getElementById('indicator-business');
    const submitBtn = document.getElementById('submitBtn');

    function selectCard(type) {
      if (type === 'personal') {
        // Activate Personal
        cardPersonal.classList.remove('bg-surface-container-low', 'shadow-none');
        cardPersonal.classList.add('bg-surface-container', 'shadow-sm');
        iconPersonal.className = 'w-12 h-12 rounded-xl flex items-center justify-center bg-primary-container text-on-primary transition-colors duration-200';
        indPersonal.className = 'w-6 h-6 rounded-full flex items-center justify-center mt-1 bg-primary-container text-on-primary transition-all duration-200 shadow-sm';
        indPersonal.innerHTML = '<span class="material-symbols-outlined text-base">check</span>';

        // Deactivate Business
        cardBusiness.classList.remove('bg-surface-container', 'shadow-sm');
        cardBusiness.classList.add('bg-surface-container-low', 'shadow-none');
        iconBusiness.className = 'w-12 h-12 rounded-xl flex items-center justify-center bg-surface-variant text-on-surface-variant transition-colors duration-200';
        indBusiness.className = 'w-6 h-6 rounded-full flex items-center justify-center mt-1 bg-surface-variant text-on-surface-variant transition-all duration-200';
        indBusiness.innerHTML = '<span class="material-symbols-outlined text-base opacity-0">check</span>';
      } else {
        // Activate Business
        cardBusiness.classList.remove('bg-surface-container-low', 'shadow-none');
        cardBusiness.classList.add('bg-surface-container', 'shadow-sm');
        iconBusiness.className = 'w-12 h-12 rounded-xl flex items-center justify-center bg-primary-container text-on-primary transition-colors duration-200';
        indBusiness.className = 'w-6 h-6 rounded-full flex items-center justify-center mt-1 bg-primary-container text-on-primary transition-all duration-200 shadow-sm';
        indBusiness.innerHTML = '<span class="material-symbols-outlined text-base">check</span>';

        // Deactivate Personal
        cardPersonal.classList.remove('bg-surface-container', 'shadow-sm');
        cardPersonal.classList.add('bg-surface-container-low', 'shadow-none');
        iconPersonal.className = 'w-12 h-12 rounded-xl flex items-center justify-center bg-surface-variant text-on-surface-variant transition-colors duration-200';
        indPersonal.className = 'w-6 h-6 rounded-full flex items-center justify-center mt-1 bg-surface-variant text-on-surface-variant transition-all duration-200';
        indPersonal.innerHTML = '<span class="material-symbols-outlined text-base opacity-0">check</span>';
      }
    }

    cardPersonal.addEventListener('click', function () {
      selectCard('personal');
    });

    cardBusiness.addEventListener('click', function () {
      selectCard('business');
    });

    submitBtn.addEventListener('click', function () {
      submitBtn.classList.add('opacity-80');
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span><span>Preparing Workspace...</span>';
      setTimeout(function () {
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-xl">check</span><span>Account Configured</span>';
      }, 700);
    });
  })();
</script></main></body></html>
